name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.2.0
      - name: Despacheteaza proiectul
        run: |
          ls -la
          ZIP=$(ls *.zip | head -n 1)
          echo "Folosesc $ZIP"
          rm -rf work
          mkdir work
          unzip -q -o "$ZIP" -d work
          ls work
      - name: Compileaza
        run: gradle build -p work/myclient
      - uses: actions/upload-artifact@v4
        with:
          name: myclient
          path: work/myclient/build/libs/*.jar
